name: Release
on:
  release:
    types: [created]
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
      - name: Package Plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x package.sh
          ./package.sh
      - name: Upload plugin zip to release
        run: |
          gh release upload "$RELEASE_TAG" \
            "plugin-transbank-webpay-magento2-${RELEASE_TAG}.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
